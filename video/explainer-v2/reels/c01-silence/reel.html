<!doctype html><html lang="en"><head><meta charset="UTF-8">
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/film.css">
<style>
/* c01 — silence. Cue table (n1 starts @[n1]):
   0.00 fade from ink · tower draws (trim path) + saffron rings pulse
   n1+0.45 "flood"        water contour lines rise from the bottom
   n1+1.62 "towers down"  rings stop, tower tips and fades to grey
   n1+2.93 "your phone"   phone outline draws on at right, lock screen
   n1+3.83 "still works"  caption line 1 mask-slides up
   n1+5.08 "network"      signal bars drop one by one, NO SERVICE
   n1+5.94 "doesn't"      caption line 2; everything dims to one saffron dot in the phone (hand-off to c02) */
#tower { left: 430px; top: 190px; width: 420px; height: 640px; overflow: visible; }
#tower path, #tower line { stroke: var(--sa); stroke-width: 3; }
#towerTop { position: absolute; left: 640px; top: 214px; width: 0; height: 0; }
#towerTop .ring { left: -150px; top: -150px; width: 300px; height: 300px; }
#water { left: -40px; top: 760px; width: 2000px; height: 380px; overflow: visible; }
#water path { stroke: rgba(236,234,229,.28); stroke-width: 2; }
#phone { left: 1180px; top: 170px; width: 330px; height: 660px; overflow: visible; }
#phone .body { stroke: var(--fg); stroke-width: 3; }
#screen { position: absolute; left: 1196px; top: 186px; width: 298px; height: 628px; border-radius: 40px; overflow: hidden;
          background: linear-gradient(180deg, #151922 0%, #0E1013 100%); }
#screen .sb { position: absolute; left: 26px; right: 26px; top: 22px; display: flex; align-items: center; justify-content: space-between; font-family: var(--sans); font-weight: 500; font-size: 20px; color: var(--fg2); }
#bars { display: flex; align-items: flex-end; gap: 4px; height: 20px; }
#bars i { display: block; width: 6px; border-radius: 2px; background: var(--sa); }
#bars i:nth-child(1) { height: 6px; } #bars i:nth-child(2) { height: 10px; } #bars i:nth-child(3) { height: 15px; } #bars i:nth-child(4) { height: 20px; }
#screen .clock { position: absolute; left: 0; right: 0; top: 120px; text-align: center; font-family: var(--sans); font-weight: 200; font-size: 104px; color: var(--fg); letter-spacing: -.02em; }
#screen .date { position: absolute; left: 0; right: 0; top: 270px; text-align: center; font-family: var(--sans); font-size: 24px; color: var(--fg2); }
#nosvc { position: absolute; left: 0; right: 0; top: 470px; text-align: center; }
#nosvc .mono { color: var(--sa); font-size: 22px; }
#dot { position: absolute; left: 1345px; top: 560px; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--sa); box-shadow: 0 0 24px 6px rgba(249,115,22,.45); opacity: 0; }
#cap { left: 150px; top: 860px; width: 1620px; }
#cap .h2 { font-size: 76px; }
#cap .l2 { color: var(--fg); }
#cap .l1 { color: var(--fg2); }
#tag { left: 150px; top: 120px; color: var(--fg2); }
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="@[END]">
<section id="s" class="scene clip" data-start="0" data-duration="@[END]" data-track-index="1">
  <div class="contours" data-layout-ignore></div>
  <div class="cam">
    <div id="tag" class="abs mono">SIH 2026 · ISRO · PS 26173</div>

    <!-- cell tower, line art -->
    <svg id="tower" class="abs draw" viewBox="0 0 420 640" data-layout-allow-overflow>
      <g id="towerG">
        <line x1="210" y1="24" x2="110" y2="620"/><line x1="210" y1="24" x2="310" y2="620"/>
        <line x1="178" y1="214" x2="242" y2="214"/><line x1="152" y1="370" x2="268" y2="370"/><line x1="128" y1="514" x2="292" y2="514"/>
        <path d="M178 214 L268 370 M242 214 L152 370 M152 370 L292 514 M268 370 L128 514"/>
        <path d="M150 90 L150 150 M270 90 L270 150 M150 120 L270 120"/>
        <line x1="60" y1="620" x2="360" y2="620"/>
      </g>
    </svg>
    <div id="towerTop"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>

    <!-- flood water: contour lines rising -->
    <svg id="water" class="abs draw" viewBox="0 0 2000 380" data-layout-ignore>
      <path d="M0 40 C200 10 400 70 600 40 S1000 10 1200 40 S1600 70 2000 40"/>
      <path d="M0 110 C220 80 440 140 660 110 S1100 80 1320 110 S1760 140 2000 110"/>
      <path d="M0 180 C180 150 360 210 540 180 S900 150 1080 180 S1440 210 2000 180"/>
    </svg>

    <!-- phone, line art + lock screen -->
    <div id="screen">
      <div class="sb"><span>4:12</span><span id="bars"><i></i><i></i><i></i><i></i></span></div>
      <div class="clock">4:12</div>
      <div class="date">Tuesday, 14 July</div>
      <div id="nosvc"><span class="mono">No service</span></div>
    </div>
    <svg id="phone" class="abs draw" viewBox="0 0 330 660" data-layout-allow-overflow>
      <rect class="body" x="4" y="4" width="322" height="652" rx="52"/>
    </svg>
    <div id="dot"></div>

    <!-- caption -->
    <div id="cap" class="abs">
      <div class="mask"><div class="ln h2 l1">Your phone still works.</div></div>
      <div class="mask"><div class="ln h2 l2">The network doesn't.</div></div>
    </div>
  </div>
  <div class="vignette" data-layout-ignore></div>
  <div class="grain" data-layout-ignore></div>
</section>
<!--@AUDIO-->
</div>
<script src="assets/film.js"></script>
<script>
const N1 = @[n1], END = @[END];
enter(0);
push(".cam", 0, END, 1.0, 1.05);
fadeIn("#tag", 0.3, 0.8);
// tower draws and transmits
draw("#tower line, #tower path", 0.1, 1.1, 0.05);
rings("#towerTop .ring", 0.6, N1 + 1.62, 1.6, 0.45);
// flood rises
draw("#water path", N1 + 0.4, 1.4, 0.12, E.p3);
tl.fromTo("#water", { y: 120 }, { y: -40, duration: 2.8, ease: E.cam }, N1 + 0.45);
tl.fromTo("#water path", { x: 0 }, { x: -120, duration: END - N1, ease: "none", immediateRender: false }, N1 + 0.45);
// towers go down: rings stop, tower tips and greys out
tl.to("#towerTop .ring", { opacity: 0, duration: 0.3, ease: E.out, overwrite: "auto" }, N1 + 1.62);
tl.to("#towerG", { rotation: 14, transformOrigin: "50% 97%", duration: 1.2, ease: "power2.in" }, N1 + 1.62);
tl.to("#tower line, #tower path", { stroke: "rgba(236,234,229,.30)", duration: 0.8, ease: E.soft }, N1 + 1.7);
tl.to("#tower", { opacity: 0.35, duration: 0.8, ease: E.soft }, N1 + 2.4);
// your phone still works
draw("#phone .body", N1 + 2.8, 0.9, 0, E.cam);
tl.fromTo("#screen", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: E.p3 }, N1 + 3.2);
maskUp("#cap .mask:nth-child(1)", N1 + 3.7);
// network doesn't: bars drop one by one, NO SERVICE
tl.to("#bars i", { backgroundColor: "rgba(236,234,229,.18)", duration: 0.18, ease: E.out, stagger: { each: 0.16, from: "end" } }, N1 + 5.0);
fadeIn("#nosvc", N1 + 5.6, 0.5, { y: 10 });
maskUp("#cap .mask:nth-child(2)", N1 + 5.85);
// hand-off: dim everything to one saffron dot in the phone
tl.to("#tower, #water, #tag", { opacity: 0, duration: 0.6, ease: E.out }, END - 1.1);
tl.to("#cap", { opacity: 0, duration: 0.5, ease: E.out }, END - 0.9);
tl.to("#screen .clock, #screen .date, #screen .sb", { opacity: 0.25, duration: 0.6, ease: E.soft }, END - 1.0);
pop("#dot", END - 0.8, 0.5);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
</body></html>
