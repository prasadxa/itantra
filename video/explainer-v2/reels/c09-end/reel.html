<!doctype html><html lang="en"><head><meta charset="UTF-8">
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/film.css">
<style>
/* c09 — end. Cue table (n12 starts @[n12], n13 starts @[n13]; word times from vo/words.txt):
   0.00          START = c08 end: tricolour strip 480x6 at the centre (left 720, top 557) on ink
   0.10-0.85     the strip's three segments stretch into the full-frame tricolour (second and last full wipe)
   n12+0.02 "iTantra"   the flag contracts into a 480x6 strip under the end card: logo + iTantra revealed
   n12+1.54 "speak in your language"   tagline line 1 blur-rises word by word
   n12+3.02 "be heard, even"            tagline line 2 starts
   n12+4.00..5.58 (pause after "even")  callback to c01: small grey line-art tower + phone draw on, bottom-left
   n12+5.94 "towers"    the tower tips and greys further (as in c01)
   n12+6.56 "silent"    a saffron packet leaves the phone, turns teal at the second phone, teal rings pulse (connected)
   n13+0.03 "Smart India Hackathon 2026"  mono credit line, word by word, bottom-right
   n13+3.39 "ISRO"  n13+5.24 "26173"      the rest of the credit line on its words
   n13_e-0.9           "Open models by IISc · IIT Madras · AI4Bharat", then the URL in teal
   END-2.5 .. END      final card holds; only the camera drifts. No fade-out. */
#brand { left: 0; top: 262px; width: 1920px; height: 170px; display: flex; align-items: center; justify-content: center; gap: 44px; }
#logo { width: 160px; height: 160px; border-radius: 35px; overflow: hidden; flex: none;
        box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 30px 80px -30px rgba(0,0,0,.9); }
#logo img { display: block; width: 168px; height: 168px; margin: -4px 0 0 -4px; }
#word { font-size: 164px; line-height: 1; color: var(--fg); letter-spacing: -.015em; padding-bottom: 10px; }
#tags { left: 0; top: 506px; width: 1920px; text-align: center; }
#tags .ln { font-family: var(--sans); font-weight: 400; font-size: 50px; line-height: 1.34; color: var(--fg); }

/* callback to c01: small grey tower + phone, the packet now gets through */
#vig { left: 150px; top: 752px; width: 620px; height: 210px; }
#vtower { left: 0; top: 14px; width: 124px; height: 189px; overflow: visible; }
#vtower line, #vtower path { stroke: rgba(236,234,229,.45); stroke-width: 8; }
.vph { top: 26px; width: 84px; height: 168px; overflow: visible; }
.vph .body { stroke: var(--fg); stroke-width: 8.5; }
.vph .scr { fill: #151922; stroke: none; }
#vA { left: 170px; } #vB { left: 470px; }
#vtrack { left: 254px; top: 100px; width: 216px; height: 20px; overflow: visible; }
#vtrack .trk { stroke: rgba(236,234,229,.20); stroke-width: 2; stroke-dasharray: 4 8; }
#vtrack .tail { stroke: var(--sa); stroke-width: 3; }
#vpk { position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--sa); box-shadow: 0 0 16px 4px rgba(249,115,22,.5); }
#vBdot { position: absolute; left: 512px; top: 110px; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--te); box-shadow: 0 0 14px 3px rgba(45,212,191,.5); }
#vAdot { position: absolute; left: 212px; top: 110px; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--sa); box-shadow: 0 0 14px 3px rgba(249,115,22,.5); }
#vRings { position: absolute; left: 512px; top: 110px; width: 0; height: 0; }
#vRings .ring { left: -90px; top: -90px; width: 180px; height: 180px; }

/* credits, bottom-right */
#cred { right: 150px; top: 806px; text-align: right; }
#cred .c1 { font-family: var(--mono); font-weight: 500; font-size: 30px; letter-spacing: .08em; color: var(--fg); white-space: nowrap; }
#cred .c1 .dot { color: var(--fg3); }
#cred .c2 { margin-top: 18px; font-family: var(--mono); font-weight: 400; font-size: 26px; letter-spacing: .04em; color: var(--fg2); white-space: nowrap; }
#cred .c3 { margin-top: 16px; font-family: var(--mono); font-weight: 500; font-size: 32px; letter-spacing: .04em; color: var(--te); white-space: nowrap; }

/* the tricolour: starts as c08's 480x6 strip, becomes the full frame, ends as the strip under the card */
.band { position: absolute; left: 720px; top: 557px; width: 160px; height: 6px; }
#b1 { left: 720px; background: var(--sa); } #b2 { left: 880px; background: #F2F2EF; } #b3 { left: 1040px; background: var(--india-green); }
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="@[END]">
<section id="s" class="scene clip" data-start="0" data-duration="@[END]" data-track-index="1">
  <div class="contours" data-layout-ignore></div>
  <div class="cam">
    <div id="brand" class="abs">
      <div id="logo"><img src="assets/img/itantra-logo.png" alt="" data-layout-allow-overflow></div>
      <div id="word" class="h1" data-layout-allow-occlusion>iTantra</div>
    </div>
    <div id="tags" class="abs">
      <div class="ln t1">Speak in your language.</div>
      <div class="ln t2">Be heard — even when the towers go silent.</div>
    </div>

    <div id="vig" class="abs">
      <svg id="vtower" class="abs draw" viewBox="0 0 420 640" data-layout-allow-overflow>
        <g id="vtowerG">
          <line x1="210" y1="24" x2="110" y2="620"/><line x1="210" y1="24" x2="310" y2="620"/>
          <line x1="178" y1="214" x2="242" y2="214"/><line x1="152" y1="370" x2="268" y2="370"/><line x1="128" y1="514" x2="292" y2="514"/>
          <path d="M178 214 L268 370 M242 214 L152 370 M152 370 L292 514 M268 370 L128 514"/>
          <path d="M150 90 L150 150 M270 90 L270 150 M150 120 L270 120"/>
          <line x1="60" y1="620" x2="360" y2="620"/>
        </g>
      </svg>
      <svg id="vA" class="abs draw vph" viewBox="0 0 330 660"><rect class="scr" x="18" y="18" width="294" height="624" rx="40"/><rect class="body" x="4" y="4" width="322" height="652" rx="52"/></svg>
      <svg id="vB" class="abs draw vph" viewBox="0 0 330 660"><rect class="scr" x="18" y="18" width="294" height="624" rx="40"/><rect class="body" x="4" y="4" width="322" height="652" rx="52"/></svg>
      <svg id="vtrack" class="abs draw" viewBox="0 0 216 20" width="216" height="20" style="left:254px;top:100px" data-layout-allow-overflow>
        <path class="trk" d="M0 10 L216 10"/>
        <path id="vpath" class="tail" d="M0 10 L216 10"/>
      </svg>
      <div id="vAdot"></div>
      <div id="vBdot"></div>
      <div id="vRings"><div class="ring te"></div><div class="ring te"></div><div class="ring te"></div></div>
      <div id="vpk"></div>
    </div>

    <div id="cred" class="abs">
      <div class="c1"><span>SMART</span> <span>INDIA</span> <span>HACKATHON</span> <span>2026</span> <span class="dot">·</span> <span>ISRO</span> <span class="dot">·</span> <span>PS</span> <span>26173</span></div>
      <div class="c2">Open models by IISc · IIT Madras · AI4Bharat</div>
      <div class="c3">itantra-106.pages.dev</div>
    </div>

    <div id="b1" class="band"></div><div id="b2" class="band"></div><div id="b3" class="band"></div>
  </div>
  <div class="vignette" data-layout-ignore></div>
  <div class="grain" data-layout-ignore></div>
</section>
<!--@AUDIO-->
</div>
<script src="assets/film.js"></script>
<script>
const N12 = @[n12], N13 = @[n13], N13E = @[n13_e], END = @[END];
const a = (s) => N12 + s, b = (s) => N13 + s;
push(".cam", 0, END, 1.0, 1.05);

// START: c08's last frame — only the strip. Card hidden under it.
tl.set("#b1", { left: 720, top: 557, width: 160, height: 6 }, 0);
tl.set("#b2", { left: 880, top: 557, width: 160, height: 6 }, 0);
tl.set("#b3", { left: 1040, top: 557, width: 160, height: 6 }, 0);
tl.set("#brand, #tags, #vig, #cred", { opacity: 0 }, 0);

// the strip becomes the full-frame tricolour (bands a hair oversized so the camera push never shows an edge)
// phase 1: the strip stretches into a thin tricolour ribbon across the frame; phase 2: the ribbon opens into the flag
const BANDS = ["#b1", "#b2", "#b3"];
const FULL = [{ top: -20, height: 380 }, { top: 358, height: 364 }, { top: 720, height: 380 }];
BANDS.forEach((s, i) => tl.to(s, { top: 551 + 6 * i, duration: 0.2, ease: "power2.inOut" }, 0.06));
BANDS.forEach((s, i) => tl.to(s, { left: -20, width: 1960, duration: 0.48, ease: "power3.inOut" }, 0.14 + Math.abs(i - 1) * 0.03));
BANDS.forEach((s, i) => tl.to(s, { ...FULL[i], duration: 0.58, ease: "expo.inOut" }, 0.50 + i * 0.04));
tl.to(".vignette", { opacity: 0.2, duration: 0.5, ease: E.soft }, 0.45);
// card sits underneath; the flag closes back into a ribbon, which then splits into the strip under the wordmark
tl.set("#brand, #tags, #vig, #cred", { opacity: 1 }, a(0.70));
tl.set("#tags .ln, #vig > *, #cred .c1 span, #cred .c2, #cred .c3", { opacity: 0 }, 0);
const STRIP_T = 466, CLOSE = a(0.72);
BANDS.forEach((s, i) => tl.to(s, { top: STRIP_T - 6 + 6 * i, height: 6, duration: 0.45, ease: "power4.inOut" }, CLOSE + Math.abs(i - 1) * 0.03));
BANDS.forEach((s, i) => tl.to(s, { left: 720 + 160 * i, width: 160, top: STRIP_T, duration: 0.75, ease: "expo.inOut" }, CLOSE + 0.49));
tl.to(".vignette", { opacity: 1, duration: 0.6, ease: E.soft }, CLOSE + 0.1);
tl.fromTo("#brand", { scale: 1.06 }, { scale: 1, duration: 1.4, ease: E.p3, immediateRender: false }, CLOSE);

// tagline on its words
tl.set("#tags .ln", { opacity: 1 }, 1.0);
blurRise("#tags .t1", 0, 0.06, 0.8, [a(1.46), a(1.80), a(2.00), a(2.28)]);
blurRise("#tags .t2", 0, 0.06, 0.8, [a(2.94), a(3.44), a(3.76), a(3.92), a(5.50), a(5.56), a(5.86), a(6.30), a(6.48)]);

// callback to c01 during the pause after "even": grey tower + phone draw on
const VIG = a(4.10);
tl.set("#vtower, #vA, #vB, #vtrack", { opacity: 1 }, VIG);
draw("#vtower line, #vtower path", VIG, 0.9, 0.035);
draw("#vA .body", VIG + 0.25, 0.8, 0, E.cam);
tl.fromTo("#vA .scr", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: E.p3 }, VIG + 0.6);
draw("#vtrack .trk", VIG + 0.6, 0.7, 0, E.cam);
draw("#vB .body", VIG + 0.7, 0.8, 0, E.cam);
tl.fromTo("#vB .scr", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: E.p3 }, VIG + 1.05);
tl.fromTo("#vAdot", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: E.pop }, VIG + 1.0);
// "towers": it tips and greys, as in c01
tl.to("#vtowerG", { rotation: 11, transformOrigin: "50% 97%", duration: 1.0, ease: "power2.in" }, a(5.90));
tl.to("#vtower line, #vtower path", { stroke: "rgba(236,234,229,.32)", duration: 0.8, ease: E.soft }, a(6.0));
// "silent": a saffron packet leaves the phone and arrives teal; teal rings = connected
const PK = a(6.52), PKD = 0.8;
tl.set("#vpk", { opacity: 1 }, PK);
packet("#vpath", "#vpk", PK, PKD, "power1.inOut", "#vpath");
tl.to("#vpk", { backgroundColor: "#2DD4BF", boxShadow: "0 0 16px 4px rgba(45,212,191,.5)", duration: 0.2, ease: E.out }, PK + PKD - 0.12);
tl.to("#vpk", { opacity: 0, duration: 0.25, ease: E.out }, PK + PKD + 0.05);
tl.fromTo("#vBdot", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: E.pop }, PK + PKD - 0.05);
rings("#vRings .ring", PK + PKD - 0.05, b(3.0), 1.6, 0.5, 0.25, 1.5);
tl.set("#vRings", { opacity: 1 }, PK + PKD - 0.1);
// the link stays lit, quietly, in teal
tl.fromTo("#vtrack .trk", { stroke: "rgba(236,234,229,.20)" }, { stroke: "rgba(45,212,191,.55)", duration: 0.6, ease: E.soft, immediateRender: false }, PK + PKD);

// n13: credits on their words
const cw = [b(-0.04), b(0.44), b(1.02), b(1.90), b(3.30), b(3.34), b(4.24), b(4.28), b(5.16)];
$$("#cred .c1 > span").forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 12, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: E.p3 }, cw[i]));
tl.fromTo("#cred .c2", { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: E.p3 }, N13E - 0.95);
tl.fromTo("#cred .c3", { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: E.p3 }, N13E - 0.55);
// END-2.5 .. END: hold. Only the camera push keeps moving.
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
</body></html>
