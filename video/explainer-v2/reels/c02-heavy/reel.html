<!doctype html><html lang="en"><head><meta charset="UTF-8">
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/film.css">
<style>
/* c02 — heavy. Cue table (n2 @[n2], n3 @[n3]):
   0.00            c01 end frame: dim lock-screen phone (cam 1.05), saffron dot at (1345,560)
   0.20            dot pulses one ring
   0.45 "spoken"   camera flies into the dot; phone scales past and fades; waveform opens out of the dot to full frame
   n2+1.94 "heavy" bars swell tall and dense (thick band)
   n2+2.74 "256"   big mono counter rolls to 256 kbps, label RAW AUDIO · 16 kHz
   n2_e            counter shrinks into a "256 kbps" tag on the waveform; waveform slides left (scale .48)
   n3+0.38 "links" three thin pipes + entrance wall draw on at right
   n3+2.44 "Bluetooth" / n3+3.36 "crowded hotspot" / n3+4.90 "long-range radio": pipe labels + "~ few hundred bps" tags
   n3+5.75         waveform slides into the wall; n3+6.41 "carry" jams: squashes + stutters; "Voice doesn't fit."
   n3+6.82 "only"  a few saffron specks trickle through the pipes
   n3+7.17 "few hundred bits"  ≈ 250 bps counter under the radio pipe
   END-1.36        collapse: text out, pipes fold to y 540, waveform flattens into ONE saffron line x 360→1560 (hand-off to c03) */
#pg { position: absolute; inset: 0; transform-origin: 1345px 560px; }
#phone { left: 1180px; top: 170px; width: 330px; height: 660px; overflow: visible; }
#phone .body { stroke: var(--fg); stroke-width: 3; }
#screen { position: absolute; left: 1196px; top: 186px; width: 298px; height: 628px; border-radius: 40px; overflow: hidden;
          background: linear-gradient(180deg, #151922 0%, #0E1013 100%); }
#screen .sb { position: absolute; left: 26px; right: 26px; top: 22px; display: flex; align-items: center; justify-content: space-between; font-family: var(--sans); font-weight: 500; font-size: 20px; color: var(--fg2); opacity: .25; }
#bars { display: flex; align-items: flex-end; gap: 4px; height: 20px; }
#bars i { display: block; width: 6px; border-radius: 2px; background: rgba(236,234,229,.18); }
#bars i:nth-child(1) { height: 6px; } #bars i:nth-child(2) { height: 10px; } #bars i:nth-child(3) { height: 15px; } #bars i:nth-child(4) { height: 20px; }
#screen .clock { position: absolute; left: 0; right: 0; top: 120px; text-align: center; font-family: var(--sans); font-weight: 200; font-size: 104px; color: var(--fg); letter-spacing: -.02em; opacity: .25; }
#screen .date { position: absolute; left: 0; right: 0; top: 270px; text-align: center; font-family: var(--sans); font-size: 24px; color: var(--fg2); opacity: .25; }
#nosvc { position: absolute; left: 0; right: 0; top: 470px; text-align: center; }
#nosvc .mono { color: var(--sa); font-size: 22px; }
#dot { position: absolute; left: 1345px; top: 560px; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--sa); box-shadow: 0 0 24px 6px rgba(249,115,22,.45); }
#dring { position: absolute; left: 1345px; top: 560px; width: 0; height: 0; }
#dring .ring { left: -70px; top: -70px; width: 140px; height: 140px; }

/* the heavy waveform: 60 bars, 1489 px wide, centred (960, 610) */
#waveWrap { position: absolute; left: 215px; top: 410px; width: 1489px; height: 400px; transform-origin: 50% 50%; }
#wave { width: 1489px; transform-origin: 100% 50%; }
#wave .bar { background: var(--sa); }

/* counter */
#cntLab { left: 214px; top: 150px; color: var(--fg2); font-size: 24px; }
#num { left: 206px; top: 176px; transform-origin: 0 0; white-space: pre; }
#num .n { font-family: var(--mono); font-weight: 500; font-size: 168px; line-height: 1; color: var(--fg); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
#num .u { font-family: var(--mono); font-weight: 500; font-size: 64px; color: var(--fg2); margin-left: 18px; }

/* pipes (line art) */
#pipes { left: 880px; top: 300px; width: 880px; height: 480px; overflow: visible; transform-origin: 50% 50%; }
#pipes path { stroke: rgba(236,234,229,.42); stroke-width: 2.5; }
#pipes .wall { stroke: rgba(236,234,229,.30); stroke-width: 3; }
.plab { position: absolute; left: 900px; font-family: var(--mono); font-weight: 500; font-size: 28px; letter-spacing: .08em; color: var(--fg); text-transform: uppercase; }
.ptag { position: absolute; left: 1340px; width: 400px; text-align: right; font-family: var(--mono); font-size: 22px; letter-spacing: .04em; color: var(--fg2); }
.speck { position: absolute; left: 0; top: 0; width: 14px; height: 4px; border-radius: 2px; background: var(--sa); box-shadow: 0 0 8px rgba(249,115,22,.6); opacity: 0; }
#bps { left: 1340px; top: 712px; width: 400px; text-align: right; white-space: pre; }
#bps .n { font-family: var(--mono); font-weight: 500; font-size: 46px; color: var(--fg); font-variant-numeric: tabular-nums; }
#bps .u { font-family: var(--mono); font-size: 24px; color: var(--fg2); letter-spacing: .06em; }
#head { left: 143px; top: 176px; }
#head .h2 { font-size: 76px; }

/* hand-off line (outside the camera so it lands on exact frame coordinates) */
#endline { position: absolute; left: 360px; top: 538.5px; width: 1200px; height: 3px; border-radius: 2px; background: var(--sa);
           box-shadow: 0 0 14px rgba(249,115,22,.55); opacity: 0; transform-origin: 50% 50%; }
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="@[END]">
<section id="s" class="scene clip" data-start="0" data-duration="@[END]" data-track-index="1">
  <div class="contours" data-layout-ignore></div>
  <div class="cam">
    <!-- c01's phone, exactly as it ended -->
    <div id="pg" data-layout-allow-overflow>
      <div id="screen">
        <div class="sb"><span>4:12</span><span id="bars"><i></i><i></i><i></i><i></i></span></div>
        <div class="clock">4:12</div>
        <div class="date">Tuesday, 14 July</div>
        <div id="nosvc"><span class="mono">No service</span></div>
      </div>
      <svg id="phone" class="abs draw" viewBox="0 0 330 660" data-layout-allow-overflow>
        <rect class="body" x="4" y="4" width="322" height="652" rx="52"/>
      </svg>
      <div id="dring"><div class="ring"></div></div>
      <div id="dot"></div>
    </div>

    <!-- counter -->
    <div id="cntLab" class="abs mono" data-layout-allow-overlap>Raw audio · 16 kHz</div>
    <div id="num" class="abs" data-layout-allow-overflow data-layout-allow-overlap><span class="n" id="numN" data-layout-allow-overlap>256</span><span class="u">kbps</span></div>

    <!-- pipes -->
    <svg id="pipes" class="abs draw" viewBox="0 0 880 480" width="880" height="480" data-layout-allow-overflow>
      <path class="wall" d="M12 80 V91 M12 109 V231 M12 249 V371 M12 389 V400"/>
      <path class="p0" d="M12 91 H860"/><path class="p0" d="M12 109 H860"/>
      <path class="p1" d="M12 231 H860"/><path class="p1" d="M12 249 H860"/>
      <path class="p2" d="M12 371 H860"/><path class="p2" d="M12 389 H860"/>
    </svg>
    <div class="plab" id="l0" style="top:340px">Bluetooth</div>
    <div class="ptag" id="t0" style="top:344px">~ few hundred bps</div>
    <div class="plab" id="l1" style="top:480px">Crowded hotspot</div>
    <div class="ptag" id="t1" style="top:484px">~ few hundred bps</div>
    <div class="plab" id="l2" style="top:620px">Long-range radio</div>
    <div class="ptag" id="t2" style="top:624px">~ few hundred bps</div>
    <div id="bps" class="abs"><span class="n" id="bpsN">≈ 250</span><span class="u"> bps</span></div>
    <div class="speck" id="k0"></div><div class="speck" id="k1"></div><div class="speck" id="k2"></div>
    <div class="speck" id="k3"></div><div class="speck" id="k4"></div><div class="speck" id="k5"></div>

    <div id="head" class="abs"><div class="mask" data-layout-allow-overflow><div class="ln h2">Voice doesn't fit.</div></div></div>

    <!-- the heavy waveform -->
    <div id="waveWrap" data-layout-allow-overflow data-layout-allow-overlap><div id="wave"></div></div>
  </div>
  <div id="endline" data-layout-allow-overlap></div>
  <div class="vignette" data-layout-ignore></div>
  <div class="grain" data-layout-ignore></div>
</section>
<!--@AUDIO-->
</div>
<script src="assets/film.js"></script>
<script>
const N2 = @[n2], N2E = @[n2_e], N3 = @[n3], END = @[END];
const W = "#wave";
bars(W, 60, 14, 11, 400);

/* ---- start state = c01's last frame (cam 1.05, dim lock screen, saffron dot) ---- */
tl.set(".cam", { scale: 1.05 }, 0);
tl.fromTo(".cam", { scale: 1.05 }, { scale: 1.08, duration: END, ease: "none", immediateRender: false }, 0);
tl.set("#waveWrap", { x: 1345 - 960, y: 560 - 610, scale: 0.1 }, 0);
tl.set(`${W} .bar`, { opacity: 0 }, 0);
tl.set("#cntLab, #num, .plab, .ptag, #bps", { opacity: 0 }, 0);
tl.set("#head .ln", { yPercent: 110 }, 0);
tl.set("#head", { opacity: 0 }, 0);

/* ---- n2: fly into the dot, the waveform opens out of it ---- */
rings("#dring .ring", 0.15, 1.4, 1.2, 0.3, 0.2, 1.6);
tl.to("#pg", { scale: 2.9, duration: 1.5, ease: E.cam }, 0.45);
tl.to("#pg", { opacity: 0, duration: 0.8, ease: E.soft }, 0.75);
tl.to(`${W} .bar`, { opacity: 1, duration: 0.3, ease: E.p3, stagger: { each: 0.012, from: "center" } }, 0.5);
tl.to("#waveWrap", { x: 0, y: 0, scale: 1, duration: 1.5, ease: E.cam }, 0.55);
eq(W, 0.5, N2 + 1.9 - 0.5, 7, 0.12, 0.42);
// "heavy": bars swell tall and dense
eq(W, N2 + 1.9, N2E + 0.1 - (N2 + 1.9), 11, 0.12, 1.0);
tl.fromTo(`${W} .bar`, { scaleX: 1 }, { scaleX: 1.55, duration: 0.6, ease: E.p3, immediateRender: false }, N2 + 1.94);
// "256": counter rolls to 256 kbps
fadeIn("#cntLab", N2 + 2.55, 0.6, { y: 12 });
tl.fromTo("#num", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E.p3 }, N2 + 2.7);
count("#numN", N2 + 2.74, 1.2, 0, 256, (v) => String(Math.round(v)).padStart(3, " "));

/* ---- n3: the counter becomes a tag; waveform moves left; the thin links draw on ---- */
const T1 = N2E + 0.05;
tl.to("#cntLab", { opacity: 0, y: -10, duration: 0.35, ease: E.out }, T1);
tl.to("#num", { x: 146 - 206, y: 350 - 176, scale: 0.36, duration: 1.1, ease: E.cam }, T1);
tl.to("#waveWrap", { x: 500 - 960, y: 540 - 610, scale: 0.48, duration: 1.1, ease: E.cam }, T1);
eq(W, N2E + 0.1, N3 + 5.75 - (N2E + 0.1), 5, 0.12, 0.85);
draw("#pipes .wall", N3 + 0.3, 0.8, 0, E.cam);
draw("#pipes .p0, #pipes .p1, #pipes .p2", N3 + 0.4, 1.0, 0.07, E.cam);
// labels on their words; the named pipe brightens
const lab = (i, t) => {
  tl.fromTo(`#l${i}`, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.6, ease: E.p3 }, t);
  tl.fromTo(`#t${i}`, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.6, ease: E.p3 }, t + 0.18);
  tl.to(`#pipes .p${i}`, { stroke: "rgba(236,234,229,.85)", duration: 0.4, ease: E.p3 }, t);
};
lab(0, N3 + 2.44); lab(1, N3 + 3.36); lab(2, N3 + 4.90);

/* ---- the jam: the waveform slides into the wall and cannot pass ---- */
const J = N3 + 6.41;
tl.to("#waveWrap", { x: 500 - 960 + 44, duration: J - (N3 + 5.7), ease: "power3.in" }, N3 + 5.7);
eq(W, N3 + 5.75, J - (N3 + 5.75), 9, 0.12, 0.95);
eq(W, J, END - 1.4 - J, 3, 0.08, 1.0);
tl.to(W, { keyframes: [ { scaleX: 0.86, duration: 0.18, ease: "power2.out" }, { scaleX: 0.93, duration: 0.22, ease: E.soft },
  { scaleX: 0.87, duration: 0.14, ease: "power2.out" }, { scaleX: 0.92, duration: 0.24, ease: E.soft }, { scaleX: 0.88, duration: 0.14, ease: "power2.out" },
  { scaleX: 0.9, duration: 0.3, ease: E.soft } ] }, J);
tl.to("#waveWrap", { keyframes: [ { x: 500 - 960 + 26, duration: 0.16, ease: "power2.out" }, { x: 500 - 960 + 42, duration: 0.22, ease: "power2.in" },
  { x: 500 - 960 + 32, duration: 0.14, ease: "power2.out" }, { x: 500 - 960 + 42, duration: 0.2, ease: "power2.in" }, { x: 500 - 960 + 36, duration: 0.3, ease: E.soft } ] }, J + 0.02);
tl.to("#pipes .wall", { stroke: "rgba(236,234,229,.7)", duration: 0.15, ease: E.p3 }, J);
tl.to("#pipes .wall", { stroke: "rgba(236,234,229,.36)", duration: 0.6, ease: E.soft }, J + 0.2);
tl.set("#head", { opacity: 1 }, J + 0.05);
maskUp("#head", J + 0.1);
// only a few bits get through
const pipeY = [400, 540, 680];
[0, 1, 2, 3, 4, 5].forEach((i) => {
  const y = pipeY[i % 3], t = N3 + 6.8 + (i % 3) * 0.12 + Math.floor(i / 3) * 0.45;
  tl.set(`#k${i}`, { x: 896, y: y - 2 }, 0);
  tl.fromTo(`#k${i}`, { opacity: 0, x: 896 }, { opacity: 1, x: 950, duration: 0.3, ease: "power1.out", immediateRender: false }, t);
  tl.to(`#k${i}`, { x: 1180 - Math.floor(i / 3) * 110, duration: END - 1.3 - t - 0.3, ease: "none" }, t + 0.3);
});
// "a few hundred bits": ≈ 250 bps under the radio pipe
tl.fromTo("#bps", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: E.p3 }, N3 + 7.1);
count("#bpsN", N3 + 7.17, 0.8, 0, 250, (v) => "≈ " + String(Math.round(v)).padStart(3, " "));

/* ---- collapse to ONE saffron line (hand-off) ---- */
const C = END - 1.36;
tl.to("#head .ln", { yPercent: -110, duration: 0.35, ease: E.out }, C);
tl.to(".speck", { opacity: 0, duration: 0.2, ease: E.out }, C);
tl.to(".plab, .ptag, #bps, #num", { opacity: 0, duration: 0.35, ease: E.out, stagger: 0.015 }, C);
tl.to("#pipes", { scaleY: 0, duration: 0.45, ease: "power3.inOut" }, C);
tl.to("#pipes", { opacity: 0, duration: 0.3, ease: E.out }, C + 0.15);
tl.to(`${W} .bar`, { scaleY: 0.04, duration: 0.35, ease: E.out, stagger: { each: 0.004, from: "edges" } }, C);
tl.to(W, { scaleX: 1, duration: 0.5, ease: E.cam }, C);
tl.to("#waveWrap", { x: 0, y: 540 - 610, scale: 0.52, duration: 0.7, ease: E.cam }, C + 0.1);
tl.fromTo("#endline", { opacity: 0, scaleX: 0.62 }, { opacity: 1, scaleX: 0.62, duration: 0.2, ease: E.p3, immediateRender: false }, C + 0.62);
tl.to("#endline", { scaleX: 1, duration: 0.6, ease: E.cam }, C + 0.66);
tl.to("#waveWrap", { opacity: 0, duration: 0.25, ease: E.soft }, C + 0.72);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
</body></html>
