<!doctype html><html lang="en"><head><meta charset="UTF-8">
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/film.css">
<style>
/* c05 — link. Cue table (n8 @[n8]):
   0.00        START = c04 end: phone node (scale 0.42) centred (330,540), empty dark screen
   0.15        second node draws on at (1590,540)
   n8+0.73 "no Wi-Fi"            top route WI-FI LAN draws dashed, then breaks with a saffron ×
   n8+1.72 "finds Wi-Fi Direct"  middle route draws, "+4 s" timer, a packet crosses (saffron → teal on arrival)
   n8+3.84 "Bluetooth"           bottom route draws, "+8 s" timer, a packet crosses
   n8+5.13 "same packets"        one packet on each live route at once
   n8+6.17 "ready for a LoRa"    camera pulls back; line-art LoRa node on the far right (ESP32 · LoRa 865 MHz, "firmware ready"),
                                 dashed long-range arcs + saffron rings (ready for — not tested)
   END-1.3                       a packet leaves on the Bluetooth route; camera zooms into it; everything else falls away
   END                           hand-off: one saffron dot, 64 px, at (960,540) on ink (c06 start) */
.dev { position: absolute; top: 210px; width: 330px; height: 660px; transform-origin: 50% 50%; }
#devL { left: 795px; } #devR { left: 795px; }
.dev svg { position: absolute; left: 0; top: 0; width: 330px; height: 660px; overflow: visible; }
.dev .body { stroke: var(--fg); stroke-width: 5; }
.dev .scr { position: absolute; left: 16px; top: 16px; width: 298px; height: 628px; border-radius: 40px; overflow: hidden;
            background: linear-gradient(180deg, #151922 0%, #0E1013 100%); }
#routes { left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
#routes .rt { stroke: rgba(236,234,229,.42); stroke-width: 2.5; fill: none; stroke-linecap: round; }
#routes .dash { stroke-dasharray: 10 14; stroke-linecap: butt; }
#routes .tail { stroke: var(--sa); stroke-width: 3; fill: none; stroke-linecap: round; opacity: 0; }
#brk { transform-origin: 960px 312.5px; }
#brk circle { fill: var(--ink); stroke: none; }
#brk line { stroke: var(--sa); stroke-width: 4; stroke-linecap: round; }
.lb { position: absolute; left: 560px; width: 800px; display: flex; justify-content: center; align-items: center; gap: 16px; }
.lb .mono { font-size: 28px; color: var(--fg); }
.lb .tm { font-family: var(--mono); font-weight: 500; font-size: 24px; letter-spacing: .06em; color: var(--fg2); border: 1px solid var(--line2);
          border-radius: 999px; padding: 5px 14px; background: rgba(22,25,32,.85); }
#lbL { top: 222px; } #lbD { top: 458px; } #lbB { top: 800px; }
.pk { position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--sa);
      box-shadow: 0 0 16px 4px rgba(249,115,22,.45); opacity: 0; }
.rx { position: absolute; left: 1590px; top: 540px; width: 0; height: 0; }
.rx .ring { left: -110px; top: -110px; width: 220px; height: 220px; }
/* LoRa bridge node (line art) */
#lora { left: 1840px; top: 330px; width: 200px; height: 290px; overflow: visible; }
#lora .o { stroke: var(--fg); stroke-width: 3; }
#lora .d { stroke: rgba(236,234,229,.35); stroke-width: 2; }
#arcs { left: 1760px; top: 150px; width: 520px; height: 520px; overflow: visible; }
#arcs path { stroke: rgba(236,234,229,.40); stroke-width: 2.5; stroke-dasharray: 3 12; fill: none; stroke-linecap: round; }
#loraTx { position: absolute; left: 1955px; top: 356px; width: 0; height: 0; }
#loraTx .ring { left: -90px; top: -90px; width: 180px; height: 180px; }
#link { left: 1660px; top: 530px; width: 200px; height: 20px; overflow: visible; }
#link line { stroke: rgba(236,234,229,.42); stroke-width: 2.5; stroke-dasharray: 8 10; }
#loraLab { left: 1740px; top: 640px; width: 400px; text-align: center; }
#loraLab .nm { font-family: var(--mono); font-weight: 500; font-size: 27px; letter-spacing: .05em; color: var(--fg); }
#loraLab .chip { margin-top: 18px; height: 52px; font-size: 24px; color: var(--fg); }
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="@[END]">
<section id="s" class="scene clip" data-start="0" data-duration="@[END]" data-track-index="1">
  <div class="contours" data-layout-ignore></div>
  <div class="cam">
    <!-- three stacked routes between the two nodes -->
    <svg id="routes" class="abs" viewBox="0 0 1920 1080" data-layout-ignore>
      <defs>
        <mask id="mL" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
          <path id="mLp" d="M420 500 C700 250 1220 250 1500 500" stroke="#fff" stroke-width="12" fill="none"/>
        </mask>
      </defs>
      <path id="rL" class="rt dash" mask="url(#mL)" d="M420 500 C700 250 1220 250 1500 500"/>
      <path id="rD" class="rt" d="M420 540 C700 520 1220 520 1500 540"/>
      <path id="rB" class="rt" d="M420 580 C700 830 1220 830 1500 580"/>
      <path id="tD" class="tail" d="M420 540 C700 520 1220 520 1500 540"/>
      <path id="tB" class="tail" d="M420 580 C700 830 1220 830 1500 580"/>
      <path id="tZ" class="tail" d="M420 580 C700 830 1220 830 1500 580"/>
      <g id="brk"><circle cx="960" cy="312.5" r="24"/>
        <line x1="949" y1="301.5" x2="971" y2="323.5"/><line x1="971" y1="301.5" x2="949" y2="323.5"/></g>
    </svg>
    <div id="lbL" class="lb"><span class="mono">Wi-Fi LAN</span></div>
    <div id="lbD" class="lb"><span class="mono">Wi-Fi Direct</span><span class="tm" id="tm4">+4 s</span></div>
    <div id="lbB" class="lb"><span class="mono">Bluetooth LE</span><span class="tm" id="tm8">+8 s</span></div>

    <!-- LoRa bridge: ready for (firmware compiled, not yet flashed) -->
    <svg id="link" class="abs" viewBox="0 0 200 20" data-layout-allow-overflow><line x1="10" y1="10" x2="186" y2="10"/></svg>
    <svg id="arcs" class="abs" viewBox="0 0 520 520" data-layout-allow-overflow>
      <path d="M233 158 A80 80 0 0 1 233 254"/>
      <path d="M262 108 A140 140 0 0 1 262 304"/>
      <path d="M290 58 A200 200 0 0 1 290 354"/>
      <path d="M318 8 A260 260 0 0 1 318 404"/>
    </svg>
    <div id="loraTx"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
    <svg id="lora" class="abs draw" viewBox="0 0 200 290" data-layout-allow-overflow>
      <rect class="o" x="30" y="100" width="110" height="150" rx="14"/>
      <rect class="d" x="52" y="124" width="44" height="44" rx="5"/>
      <path class="d" d="M52 196 H118 M52 214 H104 M52 232 H112"/>
      <line class="o" x1="115" y1="100" x2="115" y2="34"/>
      <circle class="o" cx="115" cy="26" r="8"/>
    </svg>
    <div id="loraLab" class="abs">
      <div class="nm">ESP32 · LoRa 865 MHz</div>
      <span class="chip" id="fw">firmware ready</span>
    </div>

    <!-- nodes: left = c04's phone, right = new -->
    <div id="devL" class="dev"><div class="scr"></div><svg class="draw" viewBox="0 0 330 660"><rect class="body" x="4" y="4" width="322" height="652" rx="52"/></svg></div>
    <div id="devR" class="dev"><div class="scr"></div><svg class="draw" viewBox="0 0 330 660"><rect class="body" x="4" y="4" width="322" height="652" rx="52"/></svg></div>
    <div id="rxA" class="rx"><div class="ring te"></div><div class="ring te"></div></div>
    <div id="rxB" class="rx"><div class="ring te"></div><div class="ring te"></div></div>
    <div id="rxC" class="rx"><div class="ring te"></div><div class="ring te"></div></div>

    <div class="pk" id="pD"></div><div class="pk" id="pB"></div>
    <div class="pk" id="pD2"></div><div class="pk" id="pB2"></div>
    <div class="pk" id="pZ"></div>
  </div>
  <div class="vignette" data-layout-ignore></div>
  <div class="grain" data-layout-ignore></div>
</section>
<!--@AUDIO-->
</div>
<script src="assets/film.js"></script>
<script>
const N8 = @[n8], END = @[END];
// draw() leaves a round-cap dot at each path start before it runs: keep strokes hidden until their draw begins
const drawOn = (sel, t, d, st = 0.06, ease = E.cam, op = 1) => { tl.set(sel, { opacity: 0 }, 0); tl.set(sel, { opacity: op }, t); draw(sel, t, d, st, ease); };
const TEAL = "#2DD4BF", SAF = "#F97316";
// start state = c04 end frame: phone node at 0.42 centred (330,540)
tl.set("#devL", { scale: 0.42, x: 330 - 960 }, 0);
tl.set("#devR", { scale: 0.42, x: 1590 - 960 }, 0);
tl.set("#lbL, #lbD, #lbB, #tm4, #tm8, #loraLab, #fw, #brk, #arcs", { opacity: 0 }, 0);

/* packet: a dot (+tail) runs along one of the full-frame route paths (viewBox = frame coords) */
const run = (pathSel, dotSel, t, d, v1 = 1, ease = "power1.inOut", tailSel = null, arrive = true) => {
  const p = $(pathSel), dot = $(dotSel), L = p.getTotalLength(), o = { v: 0 };
  const place = () => {
    const pt = p.getPointAtLength(o.v * L);
    dot.style.transform = `translate(${pt.x - 8}px, ${pt.y - 8}px)`;
    if (tailSel) { const tt = $(tailSel), tlen = Math.min(o.v * L, 220); tt.setAttribute("stroke-dasharray", `0 ${Math.max(0, o.v * L - tlen)} ${tlen} ${L}`); }
  };
  tl.set(o, { v: 0, onUpdate: place }, 0);
  tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", immediateRender: false }, t);
  tl.to(o, { v: v1, duration: d, ease, onUpdate: place }, t);
  if (tailSel) { tl.fromTo(tailSel, { opacity: 0 }, { opacity: 0.55, duration: 0.2, immediateRender: false }, t); }
  if (arrive) {
    if (tailSel) tl.to(tailSel, { opacity: 0, duration: 0.25, ease: E.out }, t + d - 0.2);
    tl.to(dot, { backgroundColor: TEAL, boxShadow: "0 0 16px 4px rgba(45,212,191,.45)", duration: 0.2, ease: E.soft }, t + d - 0.12);
    tl.to(dot, { opacity: 0, scale: 0.4, duration: 0.35, ease: E.out }, t + d + 0.1);
  }
};

push(".cam", 0, N8 + 5.9, 1.0, 1.03);

// second node draws on
drawOn("#devR .body", 0.12, 0.9, 0, E.cam);
tl.fromTo("#devR .scr", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: E.p3 }, 0.45);

/* no Wi-Fi: LAN route draws dashed, then breaks */
drawOn("#mLp", N8 + 0.3, 0.9, 0, E.p3);
fadeIn("#lbL", N8 + 0.55, 0.6, { y: 10 });
tl.fromTo("#brk", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: E.pop }, N8 + 1.1);
tl.to("#rL", { stroke: "rgba(236,234,229,.18)", duration: 0.5, ease: E.soft }, N8 + 1.3);
tl.to("#lbL .mono", { color: "rgba(236,234,229,.42)", duration: 0.5, ease: E.soft }, N8 + 1.3);

/* finds Wi-Fi Direct (+4 s) */
drawOn("#rD", N8 + 1.6, 0.8, 0, E.p3);
fadeIn("#lbD", N8 + 1.95, 0.6, { y: 10 });
pop("#tm4", N8 + 2.55, 0.45);
tl.to("#rD", { stroke: "rgba(236,234,229,.70)", duration: 0.4, ease: E.soft }, N8 + 2.5);
run("#rD", "#pD", N8 + 2.7, 0.85, 1, "power1.inOut", "#tD");
rings("#rxA .ring", N8 + 3.5, N8 + 5.0, 1.2, 0.3, 0.4, 1.4);

/* then Bluetooth (+8 s) */
drawOn("#rB", N8 + 3.5, 0.8, 0, E.p3);
fadeIn("#lbB", N8 + 3.7, 0.6, { y: 10 });
pop("#tm8", N8 + 4.2, 0.45);
tl.to("#rB", { stroke: "rgba(236,234,229,.70)", duration: 0.4, ease: E.soft }, N8 + 4.1);
run("#rB", "#pB", N8 + 4.3, 0.85, 1, "power1.inOut", "#tB");
rings("#rxB .ring", N8 + 5.1, N8 + 6.4, 1.2, 0.3, 0.4, 1.4);

/* the same packets: one on each live route at once */
run("#rD", "#pD2", N8 + 5.1, 0.9, 1, "power1.inOut");
run("#rB", "#pB2", N8 + 5.16, 0.9, 1, "power1.inOut");
rings("#rxC .ring", N8 + 5.95, N8 + 7.4, 1.2, 0.3, 0.4, 1.4);

/* ready for a LoRa radio bridge: camera pulls back, the node appears far right */
tl.to(".cam", { scale: 0.84, x: -190, duration: 1.3, ease: E.cam }, N8 + 5.9);
tl.fromTo("#link line", { strokeDashoffset: 0 }, { strokeDashoffset: -54, duration: 3.4, ease: "none", immediateRender: false }, N8 + 6.2);
fadeIn("#link", N8 + 6.2, 0.5, { x: -20, y: 0 });
drawOn("#lora .o, #lora .d", N8 + 6.3, 0.8, 0.05, E.p3);
fadeIn("#loraLab", N8 + 6.6, 0.6, { y: 12 });
pop("#fw", N8 + 7.0, 0.5);
tl.fromTo("#arcs", { opacity: 0, scale: 0.7, transformOrigin: "37% 40%" }, { opacity: 1, scale: 1, duration: 0.8, ease: E.in }, N8 + 7.1);
tl.fromTo("#arcs path", { strokeDashoffset: 0 }, { strokeDashoffset: -60, duration: 2.6, ease: "none", immediateRender: false }, N8 + 7.1);
rings("#loraTx .ring", N8 + 7.2, END, 1.3, 0.35, 0.35, 1.6);

/* hand-off: a packet leaves on Bluetooth; camera dives into it until it is a 64 px dot at frame centre */
const ZS = END - 1.55, V1 = 0.34;
run("#rB", "#pZ", ZS, 1.2, V1, "power2.out", "#tZ", false);
const rb = $("#rB"), P = rb.getPointAtLength(V1 * rb.getTotalLength());
const S = 4;                                            // 16 px dot x 4 = 64 px
tl.to(".cam", { scale: S, x: -S * (P.x - 960), y: -S * (P.y - 540), duration: 1.25, ease: "power3.inOut" }, ZS + 0.2);
tl.to("#routes .rt, #brk, .lb, #devL, #devR, #lora, #loraLab, #arcs, #link, .rx", { opacity: 0, duration: 0.55, ease: E.out }, ZS + 0.25);
tl.to("#loraTx", { opacity: 0, duration: 0.4, ease: E.out }, ZS + 0.25);
tl.to("#tZ", { opacity: 0, duration: 0.4, ease: E.out }, ZS + 0.7);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
</body></html>
