; iTantra LoRa Bridge firmware
; ESP32-S3 + SX1262 relay: phone (BLE, Nordic-UART-style) <-> LoRa mesh (865-867 MHz India ISM)
;
; Build (no hardware attached to this workstation - compile only, do not flash):
;   uv tool install platformio     (already done once)
;   cd firmware && pio run -e heltec_wifi_lora_32_V3
;
; To flash on real hardware later:
;   pio run -e heltec_wifi_lora_32_V3 -t upload --upload-port <serial-port>
;   pio device monitor -b 115200

[platformio]
default_envs = heltec_wifi_lora_32_V3

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    jgromes/RadioLib @ ^6.6.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags =
    -std=gnu++11

; ---- Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262, 8MB flash) ----
; https://resource.heltec.cn/download/WiFi_LoRa_32_V3
[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -DBOARD_HELTEC_V3=1

; ---- LilyGO T3-S3 (ESP32-S3 + SX1262/SX1268, 8/16MB flash) ----
; No official PlatformIO board id; built on the generic ESP32-S3 devkit board
; definition with T3-S3's SX1262 SPI pin map supplied via build_flags below.
; Verify pins against your revision's schematic before flashing real hardware.
[env:lilygo_t3s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DBOARD_LILYGO_T3S3=1
